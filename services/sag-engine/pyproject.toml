[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sag-video"
version = "0.1.0"
description = "Verified, agent-native video production proof"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=44",
  "fastapi>=0.115",
  "google-cloud-storage>=2.19",
  "google-genai>=1.30",
  "huggingface-hub>=0.34",
  "httpx>=0.27",
  "mcp>=1.20",
  "pillow>=11",
  "pydantic>=2.10",
  "psycopg>=3.2",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
sag-video = "sag_video.cli:main"
sag-video-mcp = "sag_video.mcp_server:main"
sag-video-analysis-worker = "sag_video.shorts:worker_main"
sag-video-cloud-job = "sag_video.cloud_job:main"
sag-video-import = "sag_video.importer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sag_video = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
